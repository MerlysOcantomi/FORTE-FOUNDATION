# Ejemplo ILUSTRATIVO de foundation.manifest para Finesse (España).
#
# Este archivo NO describe el estado real de Finesse: ningún bloque del catálogo está implementado
# todavía, así que las versiones y commits son ficticios y representan un estado futuro en el que
# esos bloques ya son draft o stable (un bloque candidate nunca se copia; ver spec/catalog.md).
# Sirve para fijar el formato que Mission Control leerá en cada producto y para mostrar la
# selección del handoff (§5, §14, §20) con su dependency closure completa: cada bloque que un
# bloque copiado declara en `requires` tiene su propia entrada, porque también se copió.
# Se valida con scripts/validate.py contra spec/schemas/manifest.schema.json.

